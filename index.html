<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>God's Country</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #111;
      color: white;
      text-align: center;
    }

    #player {
      padding: 20px;
    }

    #cover {
      width: 250px;
      height: 250px;
      object-fit: cover;
      margin-top: 10px;
      border-radius: 10px;
    }

    .song {
      padding: 10px;
      margin: 5px auto;
      width: 60%;
      background: #222;
      cursor: pointer;
      border-radius: 5px;
    }

    .song:hover {
      background: #333;
    }

    button {
      margin: 10px;
      padding: 10px 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="player">

  <!-- BACK BUTTON -->
  <button onclick="goBack()">⬅ Back to Library</button>

  <!-- ALBUM INFO -->
  <h1 id="albumTitle">God's Country</h1>
  <img id="cover" src="" alt="cover">

  <!-- SONG LIST -->
  <div id="songs"></div>

</div>

<audio id="audio"></audio>

<button id="playPauseBtn" onclick="togglePlay()">▶️ Play</button>

<script>

let currentAlbum = {
  name: "God's Country",
  cover: "godscountrycover.jpg",
  songs: [
      { file: "eternallife.mp3", title: "Eternal Life", artist: "Kanye West, Big Sean, Sheck Wes" },
      { file: "12000acres.mp3", title: "12,000 Acres", artist: "Kanye West, Pusha T, Victory Boyd, FXXXXY, Sean Leon" },
      { file: "palmsprings.mp3", title: "Palm Springs", artist: "Kanye West, The-Dream, Ant Clemons, KayCyy" },
      { file: "tulsa.mp3", title: "Tulsa", artist: "Kanye West" },
      { file: "southflorida.mp3", title: "South Florida", artist: "Kanye West, KayCyy" },
      {
        title: "Awakening",
        versions: [
      {
        version: "V7",
        file: "awakeningv7.mp3",
        artist: "Kanye West"
      },
      {
        version: "V5",
        file: "awakeningv5.mp3",
        artist: "Kanye West"
      },
      {
        version: "V4",
        file: "awakeningpetercollins.mp3",
        artist: "Kanye West, Peter Collins"
      },
      {
        version: "V3",
        file: "awakeningvictoryboyd.mp3",
        artist: "Kanye West, Victory Boyd"
      },
      {
        version: "V2",
        file: "awakeningkennyg.mp3",
        artist: "Kanye West"
      },
    ]
  },
      { file: "ingodscountry.mp3", title: "In God's Country", artist: "Kanye West, Justin Bieber, Common" },
      { file: "lamonsterv49.mp3", title: "LA Monster", artist: "Kanye West, Israel Boyd" },
      { file: "godscountry.mp3", title: "God's Country", artist: "Kanye West, Travis Scott" },
      { file: "washusinthebloodv6.mp3", title: "Wash Us In The Blood", artist: "Kanye West" },
      { file: "ourking.mp3", title: "Our King", artist: "Kanye West, 2 Chainz" },
      { file: "24hours.mp3", title: "24 Hours", artist: "Kanye West, KayCyy" },
      { file: "tellthevision.mp3", title: "Tell The Vision", artist: "Kanye West, 2 Chainz, Conway the Machine, Pop Smoke" },
      { file: "futuresounds.mp3", title: "Future Sounds", artist: "Kanye West, Travis Scott" },
      { file: "funmistakes.mp3", title: "Fun Mistakes", artist: "Kanye West" },
      { file: "manofgod.mp3", title: "Man of God", artist: "Kanye West, KayCyy" },
      { file: "gracenmercy.mp3", title: "Grace N Mercy", artist: "Kanye West, Dem Jointz, Momo Boyd" },
      { file: "spotlight.mp3", title: "Spotlight", artist: "Kanye West, KayCyy" },
      { file: "sinner.mp3", title: "Sinner", artist: "Kanye West, Wheezy" },
      { file: "hearourprayers.mp3", title: "Hear Our Prayers", artist: "Kanye West" },
      { file: "pulluplikeskuuurrr.mp3", title: "Pull Up Like Skuuurrr", artist: "Kanye West, KayCyy" },
      { file: "followthelight.mp3", title: "Follow The Light", artist: "Kanye West, Ant Clemons" },
      { file: "heavenandhellv16.mp3", title: "Heaven And Hell", artist: "Kanye West, Travis Scott" },
  ]
};

// BACK BUTTON
function goBack() {
  window.location.href = "https://peace345.github.io/Ye-Unreleased-Archive/";
}


// VARIABLES
let currentIndex = 0;
let currentVersionIndex = null;


// LOAD ALBUM
document.getElementById("albumTitle").innerText = currentAlbum.name;
document.getElementById("cover").src = currentAlbum.cover;


// BUILD SONG LIST
function buildSongs() {
  const songsDiv = document.getElementById("songs");
  songsDiv.innerHTML = "";

  currentAlbum.songs.forEach((song, i) => {

    // SONG WITH MULTIPLE VERSIONS
    if (song.versions) {

      const group = document.createElement("div");
      group.className = "song";

      group.innerHTML = `<strong>${song.title} ▼</strong>`;

      group.onclick = () => {

        // Prevent duplicates
        if (group.dataset.opened) return;
        group.dataset.opened = true;

        song.versions.forEach((version, versionIndex) => {

          const div = document.createElement("div");
          div.className = "song";

          div.innerHTML = `
            <div style="display:flex; align-items:center;">
              <div style="width:60px;">
                <strong>${version.version}</strong>
              </div>

              <div style="flex:1; text-align:center;">
                <strong>${song.title}</strong><br>
                <small>${version.artist}</small>
              </div>
            </div>
          `;

          div.onclick = (e) => {
            e.stopPropagation();

            currentIndex = i;
            currentVersionIndex = versionIndex;

            window.audio.src = version.file;
            window.audio.play();

            updateMediaSession({
              title: song.title,
              artist: version.artist
            });
          };

          group.after(div);
        });

      };

      songsDiv.appendChild(group);

    }

    // NORMAL SONG
    else {

      const div = document.createElement("div");
      div.className = "song";

      div.innerHTML = `
        <strong>${song.title}</strong><br>
        <small>${song.artist || ""}</small>
      `;

      div.onclick = () => playSong(i);

      songsDiv.appendChild(div);
    }

  });
}


// PLAY SONG
function playSong(i, versionIndex = null) {

  currentIndex = i;

  const song = currentAlbum.songs[i];

  // VERSION GROUP
  if (song.versions) {

    // Start with the LOWEST version.
    // Your array is highest → lowest,
    // so the lowest version is the LAST item.
    if (versionIndex === null) {
      versionIndex = song.versions.length - 1;
    }

    currentVersionIndex = versionIndex;

    const version = song.versions[versionIndex];

    window.audio.src = version.file;
    window.audio.play();

    updateMediaSession({
      title: song.title,
      artist: version.artist
    });

    return;
  }


  // NORMAL SONG
  currentVersionIndex = null;

  window.audio.src = song.file;
  window.audio.play();

  updateMediaSession(song);
}


// MEDIA SESSION
function updateMediaSession(song) {

  if (!("mediaSession" in navigator)) return;

  navigator.mediaSession.metadata = new MediaMetadata({
    title: song.title,
    artist: song.artist,
    album: currentAlbum.name,
    artwork: [
      {
        src: currentAlbum.cover,
        sizes: "512x512",
        type: "image/jpeg"
      }
    ]
  });

  navigator.mediaSession.setActionHandler("play", () => {
    window.audio.play();
  });

  navigator.mediaSession.setActionHandler("pause", () => {
    window.audio.pause();
  });

  navigator.mediaSession.setActionHandler("previoustrack", () => {

    if (!currentAlbum) return;

    // If currently playing a version, go to the previous version
    if (
      currentVersionIndex !== null &&
      currentVersionIndex > 0
    ) {
      playSong(currentIndex, currentVersionIndex - 1);
      return;
    }

    // Otherwise go to previous album track
    if (currentIndex > 0) {
      playSong(currentIndex - 1);
    } else {
      playSong(currentAlbum.songs.length - 1);
    }
  });

  navigator.mediaSession.setActionHandler("nexttrack", () => {

    if (!currentAlbum) return;

    const song = currentAlbum.songs[currentIndex];

    // If playing a version, go to the next version
    if (
      song.versions &&
      currentVersionIndex !== null &&
      currentVersionIndex < song.versions.length - 1
    ) {
      playSong(currentIndex, currentVersionIndex + 1);
      return;
    }

    // Otherwise go to next album track
    if (currentIndex < currentAlbum.songs.length - 1) {
      playSong(currentIndex + 1);
    } else {
      playSong(0);
    }
  });
}


// PLAY / PAUSE BUTTON
function togglePlay() {

  if (window.audio.paused) {
    window.audio.play();
  } else {
    window.audio.pause();
  }
}


// INITIALIZE AUDIO
window.addEventListener("DOMContentLoaded", () => {

  const audio = document.getElementById("audio");

  // Make audio available to the rest of the script
  window.audio = audio;


  // PLAY BUTTON UI
  audio.addEventListener("play", () => {
    document.getElementById("playPauseBtn").innerText = "⏸️ Pause";
  });


  // PAUSE BUTTON UI
  audio.addEventListener("pause", () => {
    document.getElementById("playPauseBtn").innerText = "▶️ Play";
  });


  // AUTOPLAY THROUGH ALBUM
  audio.addEventListener("ended", () => {

    if (!currentAlbum) return;

    const song = currentAlbum.songs[currentIndex];


    // VERSION GROUP
    if (
      song.versions &&
      currentVersionIndex !== null
    ) {

      // Your versions are stored:
      // V6 → V5 → V4 → V1
      //
      // So autoplay moves backward through the array:
      // V1 → V4 → V5 → V6

      const nextVersion = currentVersionIndex - 1;

      if (nextVersion >= 0) {
        playSong(currentIndex, nextVersion);
        return;
      }
    }


    // FINISHED ALL VERSIONS
    // Move to the next album track
    if (currentIndex < currentAlbum.songs.length - 1) {
      playSong(currentIndex + 1);
    } else {
      // End of album → restart album
      playSong(0);
    }

  });


  // BUILD THE SONG LIST
  buildSongs();

});

</script>

</body>
</html>
